openapi: 3.0.3
info:
  title: API de Rotas Visuais
  version: 1.0.0
  description: Documentação da rota para criação de rotas visuais utilizando FormData.
paths:
  /api/visual-route:
    post:
      summary: Criar rota visual
      operationId: handleCreateVisualRoute
      description: |
        Cria uma nova rota visual enviando metadados e imagens associadas via FormData.

        **Nota sobre as imagens:** Para cada item enviado no array `steps_metadata`, deve existir um campo correspondente `step_image_i` contendo o arquivo binário da imagem, onde `i` representa o índice do step (ex: `step_image_0`, `step_image_1`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: Título da rota visual.
                  example: 'Rota Histórica do Prédio Central'
                building-id:
                  type: string
                  description: Identificador único do edifício.
                  example: 'bldg-12345'
                status:
                  type: string
                  enum:
                    - published
                    - hidden
                  description: Status de visibilidade da rota.
                  example: 'published'
                steps_metadata:
                  type: array
                  description: Lista serializada em JSON contendo os metadados de cada etapa da rota.
                  items:
                    type: object
                    required:
                      - step_order
                      - description
                      - lon
                      - lat
                    properties:
                      step_order:
                        type: integer
                        description: Ordem numérica do passo.
                        example: 1
                      description:
                        type: string
                        description: Descrição do que deve ser feito ou visto nesta etapa.
                        example: 'Vire à esquerda na recepção.'
                      lon:
                        type: number
                        format: float
                        description: Longitude da coordenada geográfica.
                        example: -46.7268
                      lat:
                        type: number
                        format: float
                        description: Latitude da coordenada geográfica.
                        example: -23.5596
              required:
                - title
                - building-id
                - status
                - steps_metadata
              additionalProperties:
                type: string
                format: binary
                description: Imagens dinâmicas correspondentes a cada passo (`step_image_0`, `step_image_1`, etc.).
      responses:
        '201':
          description: Rota visual criada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Rota visual criada com sucesso.'
        '400':
          description: Dados inválidos enviados no FormData.
